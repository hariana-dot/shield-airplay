name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install pinned native toolchain
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8'

      - name: Android lint
        run: |
          ./gradlew lintRelease --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8'

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8'

      - name: Upload debug APK and lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shield-airplay-ci
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-release.html
